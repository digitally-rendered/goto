[project]
name = "gcpoto"
version = "0.1.0"
description = "A boto-like library and CLI for Google Cloud Platform"
authors = [
    {name = "Your Name",email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-cloud-storage>=2.0.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-compute>=1.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "google-cloud-pubsub (>=2.29.0,<3.0.0)",
    "google-cloud-billing (>=1.0.0)",
    "google-cloud-resource-manager (>=1.0.0)",
    "google-cloud-service-usage >=1.0.0", # Added for enabling services
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.0.0",
    "pytest-json-report>=1.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "pylint>=2.0.0",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.pylint]
max-line-length = 88
disable = [
    "C0103", # Variable name doesn't conform to snake_case naming style
    "C0111", # Missing docstring
    "R0903", # Too few public methods
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gcpoto --cov-report=html --cov-report=json --cov-report=term --html=test-reports/report.html --json-report --json-report-file=test-reports/report.json -v"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
