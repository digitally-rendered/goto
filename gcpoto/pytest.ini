[pytest]
markers =
    integration: marks tests as integration tests requiring GCP resources
    unit: marks tests as unit tests

testpaths = tests
python_files = test_*.py

# Increase verbosity for better test output
verbose = 2

# Configure coverage options
addopts = 
    --cov=gcpoto 
    --cov-report=term-missing 
    --cov-report=html:coverage_html 
    --cov-report=json:coverage.json 
    --html=test-report.html 
    --json-report 
    --json-report-file=test-report.json

# Show slow tests
xvs = 1

# Run xdist with auto-discovered number of CPUs
xvs_processes = auto
